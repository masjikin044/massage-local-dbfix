<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Message - User</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="app" class="max-w-6xl mx-auto p-4">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 border-b border-slate-700 mb-6">
      <h1 class="text-2xl font-bold text-indigo-400">DevOps Message Platform</h1>
      <div id="userInfo" class="hidden items-center gap-4">
        <span id="userNameDisplay" class="font-semibold text-slate-300"></span>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-sm px-3 py-1.5 rounded transition">Logout</button>
      </div>
    </header>

    <!-- Auth View -->
    <div id="authSection" class="max-w-md mx-auto bg-slate-800 p-6 rounded-lg shadow-xl mt-12 border border-slate-700">
      <div class="flex border-b border-slate-700 mb-6">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 pb-2 border-b-2 border-indigo-500 font-semibold text-indigo-400">Login</button>
        <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 pb-2 border-b-2 border-transparent font-semibold text-slate-400">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm mb-1 text-slate-300">Email</label>
          <input type="email" id="loginEmail" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm mb-1 text-slate-300">Password</label>
          <input type="password" id="loginPassword" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2 rounded font-semibold transition">Masuk</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-sm mb-1 text-slate-300">Username</label>
          <input type="text" id="regUsername" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm mb-1 text-slate-300">Email</label>
          <input type="email" id="regEmail" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm mb-1 text-slate-300">Password</label>
          <input type="password" id="regPassword" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm mb-1 text-slate-300">Konfirmasi Password</label>
          <input type="password" id="regConfirmPassword" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2 rounded font-semibold transition">Daftar</button>
      </form>
    </div>

    <!-- Chat App View -->
    <div id="chatSection" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 h-[75vh]">
      <!-- Sidebar Users -->
      <div class="bg-slate-800 rounded-lg p-4 border border-slate-700 flex flex-col">
        <input type="text" id="searchUser" oninput="loadUsers()" placeholder="Cari User..." class="bg-slate-900 border border-slate-700 rounded px-3 py-2 mb-4 text-sm w-full text-white">
        <div id="userList" class="flex-1 overflow-y-auto space-y-2"></div>
      </div>

      <!-- Main Chat Container -->
      <div class="md:col-span-2 bg-slate-800 rounded-lg p-4 border border-slate-700 flex flex-col">
        <div id="chatHeader" class="text-lg font-bold pb-2 border-b border-slate-700 text-slate-300">Pilih user untuk memulai percakapan</div>
        <div id="messageHistory" class="flex-1 overflow-y-auto my-4 space-y-3 pr-2"></div>
        <form id="messageForm" onsubmit="sendMessage(event)" class="flex gap-2 hidden">
          <input type="text" id="messageInput" placeholder="Tulis pesan..." required class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 px-5 py-2 rounded font-semibold transition">Kirim</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notifikasi Pesan Baru -->
  <div id="toastContainer" class="fixed top-4 right-4 z-[60] space-y-2 w-72"></div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-slate-800 p-6 rounded-lg max-w-sm w-full border border-slate-700">
      <h3 class="text-lg font-bold mb-2">Konfirmasi Hapus</h3>
      <p class="text-slate-300 text-sm mb-6">Apakah Anda yakin ingin menghapus pesan ini?</p>
      <div class="flex justify-end gap-3">
        <button onclick="closeDeleteModal()" class="px-4 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm">Batal</button>
        <button id="confirmDeleteBtn" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 rounded text-sm font-semibold">Hapus</button>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token');
    let currentUser = JSON.parse(localStorage.getItem('user'));
    let activeChatUser = null;
    let pendingDeleteId = null;
    let socket = null;

    if (token && currentUser) initChat();

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('tabLogin').className = 'flex-1 pb-2 border-b-2 border-indigo-500 font-semibold text-indigo-400';
        document.getElementById('tabRegister').className = 'flex-1 pb-2 border-b-2 border-transparent font-semibold text-slate-400';
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('tabRegister').className = 'flex-1 pb-2 border-b-2 border-indigo-500 font-semibold text-indigo-400';
        document.getElementById('tabLogin').className = 'flex-1 pb-2 border-b-2 border-transparent font-semibold text-slate-400';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        token = data.token;
        currentUser = data.user;
        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(currentUser));
        initChat();
      } catch (err) {
        alert(err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, confirmPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        alert('Registrasi berhasil! Silakan login.');
        switchAuthTab('login');
      } catch (err) {
        alert(err.message);
      }
    }

    function initChat() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('chatSection').classList.remove('hidden');
      document.getElementById('userInfo').classList.remove('hidden');
      document.getElementById('userInfo').classList.add('flex');
      document.getElementById('userNameDisplay').innerText = currentUser.username;

      // Minta izin notifikasi browser (aman dipanggil berkali-kali, browser hanya nanya sekali)
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      socket = io({ path: '/socket.io' });
      socket.on(`chat_${currentUser.id}`, (msg) => {
        notifyNewMessage(msg);
        if (activeChatUser && (msg.sender_id === activeChatUser.id || msg.receiver_id === activeChatUser.id)) {
          appendMessage(msg);
        }
      });
      socket.on('message_deleted', (data) => {
        const el = document.getElementById(`msg-${data.id}`);
        if (el) el.querySelector('.msg-text').innerText = 'Pesan ini telah dihapus.';
      });

      loadUsers();
    }

    // Notifikasi setiap kali user menerima pesan baru
    function notifyNewMessage(msg) {
      const isViewingThisChat = activeChatUser && msg.sender_id === activeChatUser.id && !document.hidden;
      const preview = msg.message.length > 60 ? msg.message.slice(0, 60) + '...' : msg.message;

      // Toast di dalam halaman (selalu tampil, tidak perlu izin browser)
      if (!isViewingThisChat) {
        showToast(msg.sender_name, preview);
      }

      // Notifikasi native browser saat tab tidak sedang aktif/fokus
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        const notif = new Notification(`Pesan baru dari ${msg.sender_name}`, { body: preview });
        notif.onclick = () => window.focus();
      }
    }

    function showToast(title, body) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'bg-slate-800 border border-indigo-500 rounded-lg shadow-lg p-4 transition-opacity duration-300';
      const safeTitle = escapeHtml(title);
      const safeBody = escapeHtml(body);
      toast.innerHTML = `
        <p class="font-semibold text-indigo-400 text-sm">💬 ${safeTitle}</p>
        <p class="text-slate-300 text-sm mt-1">${safeBody}</p>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    async function loadUsers() {
      const search = document.getElementById('searchUser').value;
      try {
        const res = await fetch(`/api/users?search=${search}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const users = await res.json();
        const userList = document.getElementById('userList');
        userList.innerHTML = users.map(u => `
          <div onclick="selectUser(${u.id}, '${u.username}')" class="p-3 bg-slate-700/50 hover:bg-slate-700 rounded cursor-pointer transition flex justify-between items-center">
            <span class="font-medium">${u.username}</span>
            <span class="text-xs text-slate-400">Online</span>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function selectUser(id, username) {
      activeChatUser = { id, username };
      document.getElementById('chatHeader').innerText = `Percakapan dengan ${username}`;
      document.getElementById('messageForm').classList.remove('hidden');
      loadMessages();
    }

    async function loadMessages() {
      try {
        const res = await fetch(`/api/messages?with=${activeChatUser.id}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const messages = await res.json();
        const history = document.getElementById('messageHistory');
        history.innerHTML = '';
        messages.forEach(msg => appendMessage(msg));
        history.scrollTop = history.scrollHeight;
      } catch (err) {
        console.error(err);
      }
    }

    function appendMessage(msg) {
      const isMe = msg.sender_id === currentUser.id;
      const history = document.getElementById('messageHistory');
      const div = document.createElement('div');
      div.id = `msg-${msg.id}`;
      div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

      div.innerHTML = `
        <div class="max-w-xs md:max-w-md p-3 rounded-lg ${isMe ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-200'} relative group">
          ${!isMe && msg.sender_name ? `<span class="text-[11px] font-semibold text-indigo-300 block mb-1">${escapeHtml(msg.sender_name)}</span>` : ''}
          <p class="msg-text text-sm">${msg.deleted_at ? 'Pesan ini telah dihapus.' : msg.message}</p>
          <span class="text-[10px] opacity-70 block text-right mt-1">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
          ${isMe && !msg.deleted_at ? `<button onclick="openDeleteModal(${msg.id})" class="text-xs text-red-300 hover:text-red-100 mt-1 block">Hapus</button>` : ''}
        </div>
      `;
      history.appendChild(div);
      history.scrollTop = history.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const message = input.value;
      if (!message || !activeChatUser) return;

      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ receiver_id: activeChatUser.id, message })
        });
        const data = await res.json();
        if (res.ok) {
          appendMessage(data);
          input.value = '';
        }
      } catch (err) {
        console.error(err);
      }
    }

    function openDeleteModal(msgId) {
      pendingDeleteId = msgId;
      document.getElementById('deleteModal').classList.remove('hidden');
      document.getElementById('confirmDeleteBtn').onclick = confirmDelete;
    }

    function closeDeleteModal() {
      pendingDeleteId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    }

    async function confirmDelete() {
      if (!pendingDeleteId) return;
      try {
        const res = await fetch(`/api/messages/${pendingDeleteId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const el = document.getElementById(`msg-${pendingDeleteId}`);
          if (el) el.querySelector('.msg-text').innerText = 'Pesan ini telah dihapus.';
        }
      } catch (err) {
        console.error(err);
      } finally {
        closeDeleteModal();
      }
    }

    function logout() {
      localStorage.clear();
      window.location.reload();
    }
  </script>
</body>
</html>
